name: QA Two Access Firebase Flows
on:
  push:
    branches: [agent/firebase-v49-recovery]
    paths:
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'scripts/qa-two-access-flows.ts'
      - 'scripts/qa-no-duplicate-business-entities.ts'
      - '.github/workflows/qa-two-access-flows.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firebase-v49-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Two-access flow contracts
        run: npx tsx scripts/qa-two-access-flows.ts
      - name: Global no-duplicate business audit
        run: npx tsx scripts/qa-no-duplicate-business-entities.ts
      - name: Reject Supabase and fake Meet runtime
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E '@supabase|VITE_SUPABASE|meet\.google\.com/(abc-defg-hij|xyz-uvwx-rst)' src server server.ts package.json .env.example; then
            echo 'Legacy/fake runtime reference detected' >&2
            exit 1
          fi
      - name: Repository hygiene
        run: |
          forbidden='scripts/apply-firebase-business-flows.py scripts/apply-firebase-v49-recovery.py scripts/apply-google-firebase-backend.py scripts/apply-public-firebase-api.py scripts/apply-two-access-fixes.py scripts/finalize-firebase-master.py scripts/fix-company-module-dedupe.py scripts/remove-fake-meet-seeds.py'
          for file in $forbidden; do
            if [ -e "$file" ]; then echo "One-time migration artifact remains: $file" >&2; exit 1; fi
          done
          count=$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')
          echo "Permanent workflow count: $count"
          test -f .github/workflows/qa-two-access-flows.yml
