name: Apply Firebase Google backend

on:
  push:
    branches: [agent/firebase-v49-recovery]
    paths:
      - scripts/apply-google-firebase-backend.py
      - .github/workflows/apply-google-firebase-backend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firebase-v49-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply backend patch
        run: python scripts/apply-google-firebase-backend.py
      - name: Install
        run: npm install
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Reject fake Meet and Supabase runtime
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git --exclude='apply-*' -E 'meet\.google\.com/(abc-defg-hij|xyz-uvwx-rst)|@supabase|VITE_SUPABASE' src server server.ts package.json .env.example; then
            echo 'Forbidden legacy integration reference detected' >&2
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .env.example package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: secure Google Calendar Meet with Firebase Auth"
          git push origin HEAD:agent/firebase-v49-recovery
