name: Finalize Firebase Master
on:
  push:
    branches: [agent/firebase-v49-recovery]
    paths:
      - scripts/finalize-firebase-master.py
      - .github/workflows/finalize-firebase-master.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firebase-v49-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/finalize-firebase-master.py
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npx tsx scripts/qa-two-access-flows.ts
      - name: Firebase-only checks
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E '@supabase|VITE_SUPABASE|meet\.google\.com/(abc-defg-hij|xyz-uvwx-rst)' src server server.ts package.json .env.example; then exit 1; fi
          if grep -n -E 'Supabase Auth|Supabase PostgreSQL|infraestrutura Supabase' src/components/views/MasterAdminView.tsx; then exit 1; fi
          if grep -n "saveToStorage('builder\|saveToStorage('aiLogs\|saveToStorage('ollamaSettings" src/services/dataService.ts; then exit 1; fi
          grep -q "builderModules:this.builderModules" src/services/dataService.ts
          grep -q "aiSettings:" src/services/dataService.ts
      - name: Commit final Master cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/views/MasterAdminView.tsx src/services/dataService.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: persist Master Builder state in Firestore"
          git push origin HEAD:agent/firebase-v49-recovery
