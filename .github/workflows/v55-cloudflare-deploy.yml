name: V55 Cloudflare Deploy

on:
  push:
    branches:
      - codex/area-programador-v55
    paths:
      - 'src/**'
      - 'app/**'
      - 'firebase/**'
      - 'tests/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - 'wrangler*.toml'
      - '.github/workflows/v55-cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials are not configured; validation passed but deploy was skipped."
          fi

      - name: Deploy
        if: steps.cloudflare.outputs.available == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Deployment skipped
        if: steps.cloudflare.outputs.available != 'true'
        run: echo "DEPLOY_SKIPPED_NO_CLOUDFLARE_SECRETS"
