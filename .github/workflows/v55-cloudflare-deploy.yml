name: V55 Cloudflare Deploy

on:
  push:
    branches:
      - codex/area-programador-v55
    paths:
      - '.github/workflows/v55-cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured in this repository."
          fi

      - name: Setup Node
        if: steps.cloudflare.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        if: steps.cloudflare.outputs.available == 'true'
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        if: steps.cloudflare.outputs.available == 'true'
        run: npm run build

      - name: Deploy
        if: steps.cloudflare.outputs.available == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Deployment unavailable
        if: steps.cloudflare.outputs.available != 'true'
        run: echo "DEPLOY_SKIPPED_NO_CLOUDFLARE_SECRETS"
