name: Fix Company Module Dedupe
on:
  push:
    branches: [agent/firebase-v49-recovery]
    paths:
      - scripts/fix-company-module-dedupe.py
      - .github/workflows/fix-company-module-dedupe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firebase-v49-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/fix-company-module-dedupe.py
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npx tsx scripts/qa-two-access-flows.ts
      - run: npx tsx scripts/qa-no-duplicate-business-entities.ts
      - name: Runtime safety
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E '@supabase|VITE_SUPABASE|meet\.google\.com/(abc-defg-hij|xyz-uvwx-rst)' src server server.ts package.json .env.example; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dataService.ts scripts/qa-no-duplicate-business-entities.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: make company module links deterministic"
          git push origin HEAD:agent/firebase-v49-recovery
