name: Apply Firebase v49 recovery

on:
  push:
    branches: [agent/firebase-v49-recovery]
    paths:
      - scripts/apply-firebase-v49-recovery.py
      - .github/workflows/apply-firebase-v49-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firebase-v49-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Firebase-only migration
        run: python scripts/apply-firebase-v49-recovery.py
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify no Supabase runtime remains
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git --exclude='apply-firebase-v49-recovery.py' --exclude='apply-firebase-v49-recovery.yml' -E '@supabase|VITE_SUPABASE|createClient\(.*supabase|from .*/supabase' src package.json .env.example; then
            echo 'Supabase runtime reference detected' >&2
            exit 1
          fi
      - name: Commit Firebase recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: rebuild RL Connect persistence on Firebase"
          git push origin HEAD:agent/firebase-v49-recovery
