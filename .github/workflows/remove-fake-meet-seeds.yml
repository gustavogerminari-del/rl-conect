name: Remove Fake Meet Seeds
on:
  push:
    branches: [agent/firebase-v49-recovery]
    paths:
      - scripts/remove-fake-meet-seeds.py
      - .github/workflows/remove-fake-meet-seeds.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firebase-v49-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/remove-fake-meet-seeds.py
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npx tsx scripts/qa-two-access-flows.ts
      - name: Reject Supabase and fake Meet runtime
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E '@supabase|VITE_SUPABASE|meet\.google\.com/(abc-defg-hij|xyz-uvwx-rst)' src server server.ts package.json .env.example; then
            exit 1
          fi
      - name: Commit clean runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dataService.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove fake Google Meet seed links"
          git push origin HEAD:agent/firebase-v49-recovery
